set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g default-terminal 'tmux-256color'
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g extended-keys on
set -s set-clipboard on

if-shell 'case "$TERM" in xterm*) true;; *) false;; esac' {
  set -as terminal-features 'xterm*:extkeys'
}

# extended-keys-format only exists in tmux >= 3.5 (pi xterm support)
if-shell 'v=$(tmux -V | sed "s/[^0-9.]//g"); test "$(printf "%s\n3.5\n" "$v" | sort -V | head -n1)" = 3.5' {
  set -g extended-keys-format csi-u
}

bind P paste-buffer

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter

if-shell 'test "$(uname)" = Darwin' {
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
} {
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
}

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

if-shell 'command -v agent-hub >/dev/null 2>&1 || test -x "$HOME/.local/bin/agent-hub"' {
  bind-key a run-shell -b 'hub=$(command -v agent-hub) || hub="$HOME/.local/bin/agent-hub"; exec "$hub" view --socket "#{socket_path}" --pane "#{pane_id}" --client "#{client_name}"'
} {
  unbind-key -q a
}

# Claude Code Passthrough Notifications
set -g allow-passthrough on

# Enable automatic renaming of windows
set-option -g automatic-rename on

# Format the window name to show only the basename of the current directory
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Status bar: no plugins, terminal background, soft blue/peach accents
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour246"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[fg=colour235,bg=colour110,bold]  #S #[bg=colour234,fg=colour110] "
set -g status-right "#[fg=colour216]%H:%M #[fg=colour244]%a %d %b "
set -g window-status-separator ""
set -g window-status-format " #[fg=colour244]#I:#W "
set -g window-status-current-format " #[fg=colour110,bold]#I:#W "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour110"
set -g message-style "bg=colour236,fg=colour216"
set -g message-command-style "bg=colour236,fg=colour110"
set -g mode-style "bg=colour110,fg=colour235"

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
