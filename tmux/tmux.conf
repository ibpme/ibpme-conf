set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g default-terminal 'tmux-256color'
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g extended-keys on
set -s set-clipboard on

if-shell 'case "$TERM" in xterm*) true;; *) false;; esac' {
  set -as terminal-features 'xterm*:extkeys'
}

bind P paste-buffer

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter

if-shell 'test "$(uname)" = Darwin' {
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
} {
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
}

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Claude Code Passthrough Notifications
set -g allow-passthrough on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'wfxr/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @tmux_power_theme 'sky'
set -g @tmux_power_left_a  ' #{USER}'
set -g @tmux_power_status_interval 1
set -g @tmux_power_right_w 'CPU/MEM : #{cpu_percentage}/#{ram_percentage}'
set -g @tmux_power_right_y ' %T'
set -g @tmux_power_right_z ' %F'

# Enable automatic renaming of windows
set-option -g automatic-rename on

# Format the window name to show only the basename of the current directory
set-option -g automatic-rename-format '#{b:pane_current_path}'

if-shell 'command -v nvidia-smi' {
  set -g @tmux_power_right_w 'CPU/MEM : #{cpu_percentage}/#{ram_percentage} | GPU/MEM : #{gpu_percentage}/#{gram_percentage}'
}

if-shell 'grep -qs Battery /sys/class/power_supply/*/type || pmset -g batt 2>/dev/null | grep -q InternalBattery' {
  set -g @tmux_power_right_x '󰁹 #{battery_percentage}'
}

run '~/.tmux/plugins/tpm/tpm'
